project:
  name: ResistNet-ST
  version: 1.0

data:
  n_districts: 766
  n_pathogens: 5
  n_antibiotics: 14
  n_quarters: 12
  start_year: 2021
  end_year: 2023

paths:
  raw: data/raw/
  processed: data/processed/
  synthetic: data/synthetic/
  results: results/

model:
  gnn_hidden: 64
  lstm_hidden: 128
  dropout: 0.3
  learning_rate: 0.001
  epochs: 100
  patience: 10

target:
  high_risk_threshold: 0.70
  expected_high_risk_proportion: [0.15, 0.20]

metrics:
  target_r2: [0.78, 0.86]
  target_mae: [0.06, 0.10]
  target_recall: [0.82, 0.90]
